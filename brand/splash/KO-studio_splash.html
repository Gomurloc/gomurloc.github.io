<title>KO Studio 스플래시 v9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --bg:#0b0b0c; --panel:#141416; --line:#2a292e; --text:#e9e4da; --muted:#8a857c; --red:#c41e2a; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font:14px/1.5 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
  main { max-width:1120px; margin:0 auto; padding:20px 16px 56px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  h1 { font-size:16px; font-weight:600; margin:0; }
  .tag { color:var(--muted); font-size:12px; }
  .opts { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:12px; }
  .opt { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .opt > span { color:var(--muted); font-size:12px; margin-right:2px; }
  .stage { position:relative; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
  .stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #ov { cursor:pointer; }
  .big { position:absolute; inset:0; margin:auto; width:84px; height:84px; border-radius:50%; padding:0;
         border:1px solid rgba(233,228,218,.35); background:rgba(11,11,12,.6); color:var(--text); font-size:26px; cursor:pointer; }
  .big[hidden] { display:none; }
  .scrub { width:100%; margin:12px 0 0; }
  input[type=range] { accent-color:var(--red); }
  .beats { position:relative; height:30px; margin-top:2px; border-top:1px solid var(--line); }
  .beat { position:absolute; top:0; bottom:0; border-left:1px solid var(--line); padding:6px 0 0 5px; font-size:11px;
          color:var(--muted); white-space:nowrap; overflow:hidden; cursor:pointer; }
  .beat:hover, .beat.key { color:var(--text); }
  .phead { position:absolute; top:-1px; bottom:0; width:2px; margin-left:-1px; background:var(--red); pointer-events:none; }
  .bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .grow { flex:1 1 auto; }
  button { height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel);
           color:var(--text); font:inherit; cursor:pointer; }
  button:hover { border-color:#45444b; }
  button[aria-pressed="true"] { border-color:var(--text); }
  .time { font-variant-numeric:tabular-nums; color:var(--muted); min-width:120px; }
  .knobs { margin-top:22px; padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .knobs-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .knobs-head h2 { font-size:14px; font-weight:600; margin:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px 24px; }
  .knob .row { display:flex; justify-content:space-between; font-size:13px; }
  .knob .val { font-variant-numeric:tabular-nums; }
  .knob small { display:block; color:var(--muted); font-size:12px; }
  .knob input { width:100%; margin:6px 0 0; }
  .note { color:var(--muted); font-size:12px; margin:16px 0 0; }
  .err { color:#e88; font-size:13px; margin-top:10px; }
  kbd { font:11px/1 ui-monospace,Consolas,monospace; border:1px solid var(--line); border-radius:4px; padding:2px 5px; }
</style>

<main>
  <header>
    <h1>KO Studio 스플래시 v9 — 한지 종이 인형</h1>
    <span class="tag">마지막에 핏방울이 바람처럼 사악 쓸림 · 1920×1080</span>
  </header>

  <div class="opts">
    <div class="opt"><span>점</span>
      <button data-dot="blood" aria-pressed="true">핏빛</button>
      <button data-dot="cinnabar" aria-pressed="false">주사(부적)</button>
    </div>
    <div class="opt"><span>쓸리는 방향</span>

      <button data-dir="se" aria-pressed="false">↘ 왼쪽 위에서</button>
      <button data-dir="nw" aria-pressed="false">↖ 오른쪽 아래에서</button>
    </div>
    <div class="opt"><span>바닥</span>
      <button data-ground="dark" aria-pressed="true">검은 한지</button>
      <button data-ground="light" aria-pressed="false">밝은 한지</button>
    </div>
  </div>

  <div class="stage">
    <canvas id="gl" width="1920" height="1080"></canvas>
    <canvas id="ov" width="1920" height="1080"></canvas>
    <button class="big" id="big" aria-label="재생">▶</button>
  </div>
  <p class="err" id="err" hidden>3D 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해줘요.</p>

  <div class="beats" id="beats"><div class="phead" id="phead"></div></div>

  <div class="bar">
    <button id="play">▶ 재생</button>
    <button id="restart">↺ 처음부터</button>
    <span class="time" id="time"></span>
    <span class="grow"></span>
    <button data-rate="1" aria-pressed="true">1×</button>
    <button data-rate="0.5" aria-pressed="false">0.5×</button>
    <button data-rate="0.25" aria-pressed="false">0.25×</button>
    <button id="snd" aria-pressed="true">소리 켜짐</button>
    <button id="video">영상 저장 (MP4)</button>
  </div>

  <section class="knobs">
    <div class="knobs-head">
      <h2>타이밍</h2>
      <span class="grow"></span>
      <button id="reset">기본값</button>
      <button id="copy">값 복사</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="note"><kbd>Space</kbd> 재생/정지 · <kbd>R</kbd> 처음부터 · <kbd>←</kbd> <kbd>→</kbd> 한 프레임씩 · 마음에 드는 값이 나오면 "값 복사"해서 채팅에 붙여줘요.<br>
      "영상 저장"은 지금 고른 점·방향·바닥·타이밍 그대로 1920×1080 60fps MP4(소리 포함)로 저장해요. Chrome이나 Edge에서 열어줘요.</p>
  </section>
</main>

            [b, 0], [q(0.2), 4, 'out'], [q(0.4), 4], [q(0.6), -4], [q(0.84), -4], [q(1), 0]], // 잘린 면 위에서 미끄덩
    headY: [[0, 0], [2.95, 0], [3.3, 2], [3.48, 3], [3.6, -2, 'out'], [3.75, 0]],

    flex: [[0, 0], [a.topple + 0.15, 0], [th - 0.06, 7], [th + 0.04, 5], [th + 0.12, 0, 'in'], [th + 0.18, 1.5, 'out'], [th + 0.25, 0, 'in']],

// ───────── 2D 리그 (서걱 전 연기, y 아래가 +) ─────────
const LEG_L = [[-5.75, -52], [10.25, -52], [-19, 0], [-35, 0]];
const LEG_R = [[-10.25, -52], [5.75, -52], [35, 0], [19, 0]];
const HIP = [0, -48];
function rot(p, c, a) {

const legsFor = (l, r) => [LEG_L.map(p => rot(p, HIP, rad(l))), LEG_R.map(p => rot(p, HIP, rad(r)))];
function rig(t) {

    r.lean += 3 * ra * Math.sin(2 * ph);

    if (i === 1) { vx = vqx; vy = vqy; }

      vx += (k * (qx - px) + c * (vqx - vx)) * h; vy += (k * (qy - py) + c * (vqy - vy)) * h;
      px += vx * h; py += vy * h;

// ───────── 종이 질감 (코드로 생성) ─────────
function paperCanvas(w, h, base, light, dark, fibers, mottle, mottleAlpha = 1) {

    for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) {
      if (x + ox + r < 0 || x + ox - r > w || y + oy + r < 0 || y + oy - r > h) continue;
      fn(x + ox, y + oy);
    }

    const x = rnd() * w, y = rnd() * h, r = w * (0.03 + rnd() * 0.12), col = rnd() < 0.5 ? light : dark, al = (0.05 + rnd() * 0.07) * mottleAlpha;
    wrap(x, y, r, (X, Y) => {
      const rg = g.createRadialGradient(X, Y, 0, X, Y, r);
      rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.globalAlpha = al; g.fillStyle = rg; g.fillRect(X - r, Y - r, r * 2, r * 2);
    });

  g.lineCap = 'round';
  for (let i = 0; i < fibers; i++) {
    const x = rnd() * w, y = rnd() * h, len = w * (0.008 + rnd() * 0.04), a = rnd() * Math.PI * 2, bend = (rnd() - 0.5) * len;
    const col = rnd() < 0.55 ? light : dark, al = 0.06 + rnd() * 0.16, lw = 0.4 + rnd() * 1.1;
    wrap(x, y, len, (X, Y) => {

  hop: at => N(at, { type: 'highpass', f: 1800, f2: 3400, dur: 0.15, q: 0.6, peak: 0.03, a: 0.03, d: 0.12 }),        // 종이가 휙
  zap: at => { O(at, { type: 'sawtooth', f: 118, peak: 0.03, a: 0.002, d: 0.05 }); N(at, { type: 'highpass', f: 2600, q: 0.7, peak: 0.06, a: 0.001, d: 0.035 }); },
  slash: at => { N(at - 0.008, { type: 'highpass', f: 2500, f2: 7500, dur: 0.08, q: 0.7, peak: 0.42, a: 0.003, d: 0.1 }); N(at + 0.03, { f: 5200, q: 3, peak: 0.05, d: 0.07 }); },
  rub: at => N(at, { f: 2400, q: 2, peak: 0.028, a: 0.04, d: 0.12 }),                                              // 잘린 면이 사각
  slide: at => N(at, { f: 3000, f2: 2000, dur: 0.14, q: 1.6, peak: 0.04, a: 0.02, d: 0.12 }),
  knock: (at, s) => { N(at, { f: 1800, q: 1, peak: 0.09 * s, a: 0.001, d: 0.045 }); N(at, { type: 'lowpass', f: 300, q: 0.7, peak: 0.1 * s, a: 0.002, d: 0.08 }); },
  splat: at => { N(at, { type: 'lowpass', f: 900, q: 0.7, peak: 0.08, a: 0.002, d: 0.07 }); N(at + 0.01, { f: 2500, q: 1, peak: 0.025, d: 0.04 }); },
  thud: at => { N(at, { type: 'lowpass', f: 1400, f2: 420, dur: 0.12, q: 0.7, peak: 0.4, a: 0.002, d: 0.12 }); N(at, { type: 'lowpass', f: 160, q: 0.7, peak: 0.12, a: 0.003, d: 0.12 }); N(at + 0.03, { type: 'highpass', f: 3000, q: 0.7, peak: 0.035, d: 0.09 }); },
  slap: at => { N(at, { type: 'lowpass', f: 2200, f2: 700, dur: 0.06, q: 0.7, peak: 0.22, a: 0.001, d: 0.07 }); N(at, { type: 'highpass', f: 3500, q: 0.7, peak: 0.04, d: 0.05 }); }, // 털-'썩'
  flutter: at => N(at, { type: 'highpass', f: 4200, f2: 6000, dur: 0.5, q: 0.7, peak: 0.014, a: 0.15, d: 0.5 }),               // 섬유 흩날림
  tick: (at, s = 1) => N(at, { f: 2600 + 900 * s, q: 1.4, peak: 0.012 + 0.018 * s, d: 0.014 }),

function events() {
  const ev = [];
  for (let k = 0; ; k++) {
    const tk = (0.25 + 0.5 * k) / 3.5;
    if (tk > 1.15) break;
    if (tk < 0.33 || Math.abs(tk - 1.0) < 0.06) continue;
    ev.push([tk, at => SFX.step(at, 1, k)]);
  }
  ev.push([1.0, SFX.trip], [1.2, SFX.skid], [1.52, SFX.stop], [1.68, at => SFX.step(at, 0.4)]);
  ev.push([1.97, SFX.shuffle], [2.47, SFX.shuffle], [2.77, SFX.shuffle]);
  ev.push([2.95, SFX.sigh], [3.48, SFX.hop], [3.72, at => SFX.step(at, 0.6)]);
  ev.push([A.flicker, SFX.zap], [A.flicker + 0.11, SFX.zap], [A.slash, SFX.slash], [A.slash + 0.08, SFX.flutter]);
  const b = A.bt, h = P.huh;

  ev.push([A.drop, SFX.slide]);
  ev.push([A.headImpact, at => SFX.knock(at, 1.2)], [A.headImpact + 0.005, SFX.splat]);
  ev.push([A.headLand2, at => SFX.knock(at, 0.5)]);
  ev.push([A.thud, SFX.thud], [A.thud + 0.12, SFX.slap]);
  RATTLE.forEach(([tt, s]) => ev.push([tt, at => SFX.tick(at, s)]));
  ev.push([A.eulerEnd, SFX.clack], [A.paint, SFX.brush]);
  return ev.map(([te, fn]) => [unwarp(te), fn]); // 히트스톱만큼 뒤로 밀린 실제 시간
}
function scheduleLevel(param, from, map, points) {
  let cur = points[0][1];
  for (let i = 0; i < points.length - 1; i++) {
    const [ta, va] = points[i], [tb, vb] = points[i + 1];
    if (from >= ta && from < tb) cur = lerp(va, vb, prog(from, ta, tb));
    else if (from >= tb) cur = vb;
  }
  param.setValueAtTime(Math.max(cur, 0.0001), map(from));
  for (const [tp, v] of points) if (tp > from) param.linearRampToValueAtTime(Math.max(v, 0.0001), map(tp));
}
function startBeds(from, map) {
  if (from < A.slash) {
    const s = actx.createBufferSource(); s.buffer = brownBuf(); s.loop = true;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 280;
    const hum = actx.createOscillator(); hum.frequency.value = 50;
    const hg = actx.createGain(); hg.gain.value = 0.18;
    const g = actx.createGain();
    scheduleLevel(g.gain, from, map, [[0, 0], [0.5, 0.07], [A.slash - 0.002, 0.07], [A.slash + 0.01, 0]]);
    s.connect(lp); lp.connect(g); hum.connect(hg); hg.connect(g); g.connect(bus);
    const a = map(from), b = map(A.slash) + 0.05;
    s.start(a); hum.start(a); s.stop(b); hum.stop(b);
    loops.push(s, hum);
  }
  if (from < END) {
    const st = unwarp(A.studio), fo = unwarp(A.fadeOut);
    const g = actx.createGain();
    scheduleLevel(g.gain, from, map, [[st, 0], [Math.min(st + 0.9, fo), 0.1], [fo, 0.1], [END, 0]]);
    g.connect(bus);
    const a = map(Math.max(from, st)), b = map(END) + 0.05;
    [[55, 1], [82.4, 0.5], [110, 0.25]].forEach(([f, v]) => {
      const o = actx.createOscillator(); o.frequency.value = f;
      const og = actx.createGain(); og.gain.value = v;
      o.connect(og); og.connect(g); o.start(a); o.stop(b); loops.push(o);

function stopAudio() {

    const b = bus;

    setTimeout(() => b.disconnect(), 150);
    bus = null;
  }
  loops.forEach(n => { try { n.stop(); } catch (e) {} });

}

// ───────── 재생 ─────────
let t = 0, playing = false, rate = 1, soundOn = true, clock = null;
function play(from = t) { // 여기부터 시간은 전부 실제 재생 시간
  if (from >= END - 0.001) from = 0;
  t = from; playing = true; big.hidden = true;
  if (soundOn) {
    ensureAudio(); stopAudio();
    bus = actx.createGain(); bus.connect(actx._out);
    const c0 = actx.currentTime + 0.05;
    const map = te => c0 + (te - from) / rate;
    for (const [te, fn] of events()) if (te >= from - 0.001) fn(map(te));
    startBeds(from, map);
    clock = { audio: true, t0: from, c0 };
  } else {
    stopAudio();
    clock = { audio: false, t0: from, c0: performance.now() / 1000 };
  }
  syncUI();
}
function pause() { playing = false; stopAudio(); syncUI(); }
function seek(nt) { if (playing) pause(); t = clamp(nt, 0, END); render(t); syncUI(); }
function clockT() {
  const now = clock.audio ? actx.currentTime : performance.now() / 1000;
  return clock.t0 + Math.max(0, now - clock.c0) * rate;
}
function loop() {
  if (playing) {
    t = clockT();
    if (t >= END) { t = END; playing = false; stopAudio(); }
    render(t); syncUI();
  }
  requestAnimationFrame(loop);
}

// 정지 로고 뽑기: 마지막 장면을 고해상도로 다시 렌더링 (main = 16:9 검은 한지, alpha = 투명 배경 + 그림자만, icon = 정사각 K·O)
let expR = null;
async function exportStill(kind) {
  const ta = A.studio + 2.0, sq = kind === 'icon' || kind === 'dot', W2 = sq ? 2048 : 3840, H2 = sq ? 2048 : 2160;
  if (!expR) {

  }
  expR.setPixelRatio(1); expR.setSize(W2, H2, false);
  expR.toneMapping = renderer.toneMapping; expR.toneMappingExposure = renderer.toneMappingExposure;
  updateScene(ta, unwarp(ta));
  const cam = camera.clone(); cam.aspect = W2 / H2;
  if (kind === 'icon') { cam.position.set(0, 1150, 19); cam.up.set(1, 0, 0); cam.lookAt(0, 0, 19); }
  if (kind === 'dot') { cam.position.set(0, 180, 15); cam.up.set(1, 0, 0); cam.lookAt(0, 0, 15); } // 점만 44단위 정사각으로 (인쇄물용)
  cam.updateProjectionMatrix();
  const saved = { bg: scene.background, fog: scene.fog };
  cone.visible = dust.visible = fibMesh.visible = false;
  if (sq) label.m.visible = false;
  if (kind === 'dot') { root.visible = false; head.visible = false; }
  let catcher = null;
  if (kind === 'dot') { scene.background = null; scene.fog = null; floor.visible = false; expR.setClearColor(0x000000, 0); }
  if (kind === 'alpha') {
    scene.background = null; scene.fog = null; floor.visible = false;
    catcher = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity: 0.4 }));
    catcher.rotation.x = -Math.PI / 2; catcher.position.y = 0.05; catcher.receiveShadow = true; scene.add(catcher);
    expR.setClearColor(0x000000, 0);
  }
  expR.render(scene, cam);
  const out = document.createElement('canvas'); out.width = W2; out.height = H2;
  const g = out.getContext('2d'); g.drawImage(expR.domElement, 0, 0);
  if (kind !== 'alpha' && kind !== 'dot') {
    const rg = g.createRadialGradient(W2 / 2, H2 / 2, Math.min(W2, H2) * 0.35, W2 / 2, H2 / 2, Math.max(W2, H2) * 0.62);
    rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0.55)');
    g.fillStyle = rg; g.fillRect(0, 0, W2, H2);

  if (catcher) { scene.remove(catcher); catcher.geometry.dispose(); catcher.material.dispose(); }
  render(t);
  return new Promise(r => out.toBlob(r, 'image/png'));
}

// ───────── 영상 저장: 한 프레임씩 렌더링해서 MP4(H.264 + AAC)로 ─────────
// 소리는 재생할 때와 같은 효과음 일정을 OfflineAudioContext에 미리 그려서 넣음 (영상 시간 = 실제 재생 시간)
async function renderAudio(sr) {
  const off = new OfflineAudioContext(2, Math.ceil((END + 0.3) * sr), sr);
  const saved = { actx, bus, loops, NB, BB };
  actx = off; NB = BB = null; loops = [];
  try {
    const comp = off.createDynamicsCompressor();
    comp.threshold.value = -10; comp.ratio.value = 4; comp.connect(off.destination);
    bus = off.createGain(); bus.connect(comp);
    const map = te => te;
    for (const [te, fn] of events()) fn(map(te));
    startBeds(0, map);
    return await off.startRendering();
  } finally { ({ actx, bus, loops, NB, BB } = saved); }
}
// 창이 가려져 있어도 느려지지 않게 setTimeout 대신 MessageChannel로 잠깐 양보
const yieldTask = () => new Promise(r => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); });
async function exportVideo({ fps = FPS, bitrate = 24e6, onProgress = () => {} } = {}) {
  if (typeof VideoEncoder === 'undefined') throw new Error('이 브라우저는 영상 저장을 지원하지 않아요. Chrome이나 Edge 최신 버전에서 열어줘요.');
  const { Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/+esm');
  if (playing) pause();
  const sr = 48000, aCfg = { sampleRate: sr, numberOfChannels: 2, bitrate: 192000 };
  let acodec = null;
  if (typeof AudioEncoder !== 'undefined') {
    for (const c of ['mp4a.40.2', 'opus']) if ((await AudioEncoder.isConfigSupported({ codec: c, ...aCfg })).supported) { acodec = c; break; }
  }
  const vCfg = { codec: 'avc1.64002A', width: W, height: H, bitrate, framerate: fps, avc: { format: 'avc' }, latencyMode: 'quality' };
  if (!(await VideoEncoder.isConfigSupported(vCfg)).supported) throw new Error('이 브라우저에서 H.264 인코딩을 쓸 수 없어요.');
  const target = new ArrayBufferTarget();
  const muxer = new Muxer({
    target, fastStart: 'in-memory', firstTimestampBehavior: 'offset',
    video: { codec: 'avc', width: W, height: H, frameRate: fps },
    ...(acodec && { audio: { codec: acodec === 'opus' ? 'opus' : 'aac', numberOfChannels: 2, sampleRate: sr } }),
  });
  let encErr = null;
  const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { encErr = e; } });
  ve.configure(vCfg);
  const comp = document.createElement('canvas'); comp.width = W; comp.height = H;
  const cg = comp.getContext('2d');
  const n = Math.round(END * fps) + 1, dur = Math.round(1e6 / fps);
  for (let i = 0; i < n; i++) {
    if (encErr) throw encErr;
    render(Math.min(i / fps, END));
    cg.drawImage(glc, 0, 0); cg.drawImage(ovc, 0, 0);
    const vf = new VideoFrame(comp, { timestamp: Math.round(i * 1e6 / fps), duration: dur });
    ve.encode(vf, { keyFrame: i % (fps * 2) === 0 }); vf.close();
    while (ve.encodeQueueSize > 6) await yieldTask();
    if (i % 6 === 0) { onProgress(i / n * 0.92); await yieldTask(); }
  }
  await ve.flush(); ve.close();
  if (acodec) {
    const buf = await renderAudio(sr), total = Math.min(buf.length, Math.round(n / fps * sr));
    const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => { encErr = e; } });
    ae.configure({ codec: acodec, ...aCfg });
    const L = buf.getChannelData(0), R = buf.getChannelData(1);
    for (let s0 = 0; s0 < total; s0 += sr) {
      const m = Math.min(sr, total - s0), data = new Float32Array(m * 2);
      data.set(L.subarray(s0, s0 + m), 0); data.set(R.subarray(s0, s0 + m), m);
      const ad = new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: m, numberOfChannels: 2, timestamp: Math.round(s0 / sr * 1e6), data });
      ae.encode(ad); ad.close();
    }
    await ae.flush(); ae.close();
  }
  if (encErr) throw encErr;
  muxer.finalize();
  onProgress(1);
  render(t);
  return new Blob([target.buffer], { type: 'video/mp4' });
}
$('video').addEventListener('click', async e => {
  const b = e.currentTarget, label = b.textContent;

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
